name: Build, Test and Push

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'  # 推送以 v 开头的 tag 时触发（例如：v1.0.5）
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:  # 允许手动触发
    inputs:
      tag:
        description: 'Docker image tag'
        required: true
        default: 'latest'

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore DicomSCP.sln

    - name: Build
      run: dotnet build DicomSCP.sln -c Release --no-restore --nologo

    - name: Unit tests
      run: dotnet test DicomSCP.Tests/DicomSCP.Tests.csproj -c Release --no-build --nologo

    - name: End-to-end tests
      run: dotnet test DicomSCP.IntegrationTests/DicomSCP.IntegrationTests.csproj -c Release --no-build --nologo

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: test
    # tag 推送或手动触发时才推送镜像；PR/分支推送仅校验构建
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract tag name
      id: tag
      if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
      run: |
        if [ "${{ github.event_name }}" == "push" ]; then
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
        else
          echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
        fi

    - name: Build and push
      if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        platforms: linux/amd64
        tags: |
          fightroad/dicomscp:${{ steps.tag.outputs.tag }}
          fightroad/dicomscp:latest
        cache-from: type=registry,ref=fightroad/dicomscp:buildcache
        cache-to: type=registry,ref=fightroad/dicomscp:buildcache,mode=max

    - name: Build only (validation)
      if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        platforms: linux/amd64
